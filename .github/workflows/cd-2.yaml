name: cd
on:
  release:
    types: [published]

jobs:
  deploy-app-solution-center:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Limita el tiempo de ejecución a 15 minutos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Determine tag type and Docker repo
        id: determine-tag
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [[ "${GITHUB_REF_NAME}" =~ ^[0-9.]+$ ]]; then
            echo "TAG_TYPE=main" >> $GITHUB_ENV
            echo "JENKINS_URL=${{ secrets.JENKINS_PROD_URL }}" >> $GITHUB_ENV
            echo "DOCKERFILE_PATH=.deploy/Dockerfile" >> $GITHUB_ENV
            echo "DOCKER_REPO=${{ secrets.DOCKERHUB_USERNAME }}/${REPO_NAME}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" =~ ^[0-9.]+(-testing)?$ ]]; then
            echo "TAG_TYPE=testing" >> $GITHUB_ENV
            echo "JENKINS_URL=${{ secrets.JENKINS_TEST_URL }}" >> $GITHUB_ENV
            echo "DOCKERFILE_PATH=.deploy-testing/Dockerfile" >> $GITHUB_ENV
            echo "DOCKER_REPO=${{ secrets.DOCKERHUB_USERNAME }}/testing-${REPO_NAME}" >> $GITHUB_ENV
          fi
      
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true 
          file: ${{ env.DOCKERFILE_PATH }}  # Especifica la ruta al Dockerfile
          tags: |
            ${{ env.DOCKER_REPO }}:${{ github.ref_name }}
            ${{ env.DOCKER_REPO }}:${{ env.TAG_TYPE }}-${{ github.ref_name }}
        if: ${{ env.TAG_TYPE }}
      
      - name: Pull image on server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          ssh -o StrictHostKeyChecking=no -i "$SSH_PRIVATE_KEY" user@server "docker pull ${{ env.DOCKER_REPO }}:${{ github.ref_name }} && docker pull ${{ env.DOCKER_REPO }}:${{ env.TAG_TYPE }}-${{ github.ref_name }}"
        if: ${{ env.TAG_TYPE }}

      - name: Jenkins Trigger
        run: curl ${{ env.JENKINS_URL }}
        if: ${{ env.JENKINS_URL }}