name: CD prod
on:
  release:
    types: [published]
jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      is_valid_tag: ${{ steps.set-env.outputs.is_valid_tag }}
    steps:
      - id: set-env
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Validar si es un tag de producción (solo números y puntos)
          if [[ $TAG =~ ^[0-9.]+$ ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "is_valid_tag=true" >> $GITHUB_OUTPUT
          # Validar si es un tag de testing (números, puntos y sufijo opcional)
          elif [[ $TAG =~ ^[0-9.]+(-[a-zA-Z0-9]+)?$ ]]; then
            echo "environment=testing" >> $GITHUB_OUTPUT
            echo "is_valid_tag=true" >> $GITHUB_OUTPUT
          else
            echo "is_valid_tag=false" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    needs: determine-environment
    if: needs.determine-environment.outputs.is_valid_tag == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Get release version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set deployment variables
        id: vars
        run: |
          if [ "${{ needs.determine-environment.outputs.environment }}" = "production" ]; then
            echo "deploy_path=/opt/docker/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
            echo "dockerfile_path=.deploy/Dockerfile" >> $GITHUB_OUTPUT
            echo "compose_file=.deploy/docker-compose.yml" >> $GITHUB_OUTPUT
            echo "docker_repo=${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          else
            echo "deploy_path=/opt/docker/${{ github.event.repository.name }}-testing" >> $GITHUB_OUTPUT
            echo "dockerfile_path=.deploy-testing/Dockerfile" >> $GITHUB_OUTPUT
            echo "compose_file=.deploy-testing/docker-compose.yml" >> $GITHUB_OUTPUT
            echo "docker_repo=${{ secrets.DOCKERHUB_USERNAME }}/testing-${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.vars.outputs.dockerfile_path }}
          push: true
          tags: ${{ steps.vars.outputs.docker_repo }}:${{ steps.get_version.outputs.VERSION }}

      - name: Check SSH connection
        run: ssh ${{ needs.determine-environment.outputs.environment == 'production' && secrets.PROD_SERVER_USER || secrets.TEST_SERVER_USER }}@${{ needs.determine-environment.outputs.environment == 'production' && secrets.PROD_SERVER_HOST || secrets.TEST_SERVER_HOST }} 'echo "SSH connection successful"'

      - name: Deploy to Docker
        uses: tristiisch/docker-stack-deployment@v2
        with:
          remote_docker_host: ${{ needs.determine-environment.outputs.environment == 'production' && secrets.PROD_SERVER_HOST || secrets.TEST_SERVER_HOST }}
          remote_docker_username: ${{ needs.determine-environment.outputs.environment == 'production' && secrets.PROD_SERVER_USER || secrets.TEST_SERVER_USER }}
          ssh_private_key: ${{ needs.determine-environment.outputs.environment == 'production' && secrets.PROD_SSH_PRIVATE_KEY || secrets.TEST_SSH_PRIVATE_KEY }}
          ssh_public_key: ${{ needs.determine-environment.outputs.environment == 'production' && secrets.PROD_SSH_PUBLIC_KEY || secrets.TEST_SSH_PUBLIC_KEY }}
          deployment_mode: docker-swarm
          copy_stack_file: true
          deploy_path: ${{ steps.vars.outputs.deploy_path }}
          stack_file_path: ${{ steps.vars.outputs.compose_file }}
          keep_files: 5
          docker_remove_orphans: true
          stack_name: UPLOAD
          args: --with-registry-auth
          secrets: |
            ${{ github.event.repository.name }}
            app
            DOCKER_IMAGE_TAG ${{ steps.get_version.outputs.VERSION }}
            DOCKERHUB_USERNAME ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ needs.determine-environment.outputs.environment == 'production' && secrets.DISCORD_WEBHOOK_PROD || secrets.DISCORD_WEBHOOK_TEST }}
          title: "🚀 Deployment Notification"
          description: |
            **Repository:** ${{ github.repository }}
            **Environment:** ${{ needs.determine-environment.outputs.environment }}
            **Version:** ${{ steps.get_version.outputs.VERSION }}
            **Status:** ${{ job.status }}
          color: ${{ job.status == 'success' && '0x00ff00' || '0xff0000' }}
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png

